<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Ilustrasi alat Trash-Sure</title>
  <desc id="d">Alat pemilah sampah otomatis dengan tiga wadah: organik, plastik, dan B3.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f4ec"/><stop offset="1" stop-color="#cfe9da"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b5a3b"/><stop offset="1" stop-color="#07472f"/>
    </linearGradient>
  </defs>

  <!-- latar -->
  <path d="M70 210C60 120 150 40 270 40C390 40 470 110 462 215C455 320 380 385 265 385C150 385 80 315 70 210Z" fill="url(#bg)"/>
  <circle cx="452" cy="70" r="26" fill="#f4f9f6" opacity=".9"/>
  <circle cx="60" cy="330" r="16" fill="#f4f9f6" opacity=".9"/>

  <!-- daun dekorasi -->
  <g fill="#1f8a5b" opacity=".35">
    <path d="M30 140C60 120 90 135 95 170C65 180 40 165 30 140Z"/>
    <path d="M490 250C462 236 438 250 436 282C464 290 484 276 490 250Z"/>
  </g>

  <!-- bayangan -->
  <ellipse cx="260" cy="392" rx="150" ry="9" fill="#07472f" opacity=".14"/>

  <!-- lintasan jatuh -->
  <g fill="none" stroke="#07472f" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round" opacity=".45">
    <path d="M128 98Q190 70 232 100"/>
    <path d="M260 66L260 96"/>
    <path d="M398 104Q338 72 290 100"/>
  </g>

  <!-- sampah: kulit apel -->
  <g transform="translate(112 92) rotate(-18)">
    <path d="M0 -6C-14 -18 -26 -2 -22 12C-18 28 -6 30 0 26C6 30 18 28 22 12C26 -2 14 -18 0 -6Z" fill="#ef4444"/>
    <path d="M0 -6C-2 -14 0 -20 4 -24" stroke="#7c4a1d" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M4 -16C12 -26 22 -22 24 -18C16 -12 8 -12 4 -16Z" fill="#1f8a5b"/>
    <path d="M10 8C16 8 20 14 18 20C14 16 10 14 10 8Z" fill="#f4f9f6"/>
  </g>
  <!-- sampah: botol plastik -->
  <g transform="translate(260 34)">
    <rect x="-6" y="-8" width="12" height="10" rx="3" fill="#0369a1"/>
    <path d="M-7 2H7L13 14V40C13 44 10 46 6 46H-6C-10 46 -13 44 -13 40V14Z" fill="#7dd3fc" stroke="#0284c7" stroke-width="2"/>
    <rect x="-13" y="20" width="26" height="10" fill="#0284c7" opacity=".35"/>
  </g>
  <!-- sampah: baterai -->
  <g transform="translate(414 98) rotate(24)">
    <rect x="-10" y="-22" width="20" height="44" rx="5" fill="#64748b"/>
    <rect x="-5" y="-27" width="10" height="6" rx="2" fill="#f97316"/>
    <rect x="-10" y="-8" width="20" height="12" fill="#f97316"/>
    <path d="M2 -6L-4 2H0L-2 8L4 0H0Z" fill="#fff"/>
  </g>

  <!-- badan alat -->
  <rect x="160" y="122" width="200" height="150" rx="22" fill="url(#body)"/>
  <rect x="198" y="102" width="124" height="30" rx="11" fill="#043322"/>
  <rect x="214" y="110" width="92" height="9" rx="4.5" fill="#0f7a50"/>

  <!-- layar -->
  <rect x="180" y="146" width="160" height="72" rx="12" fill="#f4f9f6"/>
  <circle cx="196" cy="160" r="4" fill="#22c55e"/>
  <rect x="206" y="157" width="46" height="6" rx="3" fill="#cfe3d8"/>
  <rect x="204" y="176" width="22" height="30" rx="4" fill="#1f8a5b"/>
  <rect x="236" y="186" width="22" height="20" rx="4" fill="#0284c7"/>
  <rect x="268" y="194" width="22" height="12" rx="4" fill="#64748b"/>
  <rect x="300" y="160" width="26" height="46" rx="6" fill="#e6f1ea"/>
  <path d="M306 190l6-8 5 4 6-12" stroke="#07472f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- chip ESP32 -->
  <rect x="232" y="230" width="56" height="26" rx="5" fill="#0f7a50"/>
  <g stroke="#9fd3b6" stroke-width="2" stroke-linecap="round">
    <path d="M240 227v3M250 227v3M260 227v3M270 227v3M280 227v3M240 256v3M250 256v3M260 256v3M270 256v3M280 256v3"/>
  </g>
  <text x="260" y="247" text-anchor="middle" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="10" font-weight="800" fill="#e6f4ec">ESP32</text>
  <circle cx="178" cy="238" r="4" fill="#22c55e"/><circle cx="342" cy="238" r="4" fill="#f97316"/>

  <!-- wadah -->
  <g>
    <rect x="160" y="272" width="62" height="92" rx="10" fill="#1f8a5b"/>
    <rect x="229" y="272" width="62" height="92" rx="10" fill="#0284c7"/>
    <rect x="298" y="272" width="62" height="92" rx="10" fill="#64748b"/>
    <rect x="160" y="272" width="62" height="12" fill="#000" opacity=".12"/>
    <rect x="229" y="272" width="62" height="12" fill="#000" opacity=".12"/>
    <rect x="298" y="272" width="62" height="12" fill="#000" opacity=".12"/>
  </g>
  <!-- ikon wadah -->
  <g transform="translate(176 300) scale(1.25)" fill="#fff">
    <path d="M17 8C8 10 5 16 5 21C7 21 13 21 18 16C21 13 20 8 17 8Z"/>
    <path d="M7 19C10 15 14 12 18 10" stroke="#1f8a5b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
  <g transform="translate(244 298) scale(1.3)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 19H4.8a1.8 1.8 0 0 1-1.6-.9 1.8 1.8 0 0 1 0-1.8L7.2 9.5"/>
    <path d="M11 19h8.2a1.8 1.8 0 0 0 1.6-.9 1.8 1.8 0 0 0 0-1.8L16.8 9.5"/>
    <path d="M12 5.5l3.8 6.5H8.2z"/>
  </g>
  <g transform="translate(313 300) scale(1.3)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3L22 20H2Z"/><path d="M12 10v5"/><circle cx="12" cy="17.6" r=".6" fill="#fff"/>
  </g>
  <g font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="10" font-weight="800" fill="#07472f" text-anchor="middle" letter-spacing=".6">
    <text x="191" y="382">ORGANIK</text><text x="260" y="382">PLASTIK</text><text x="329" y="382">B3</text>
  </g>
</svg>
